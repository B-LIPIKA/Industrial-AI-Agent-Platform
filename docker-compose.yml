version: '3.8'

services:
  api:
    build: .
    container_name: enginemind-api
    command: uvicorn app.api:app --host 0.0.0.0 --port 8000
    ports:
      - "8000:8000"
    environment:
      - OLLAMA_BASE_URL=http://host.docker.internal:11434
      - OLLAMA_MODEL=llama3
    volumes:
      - ./data:/app/data
      - ./models/saved:/app/models/saved
      - ./docs:/app/docs
    restart: unless-stopped

  ui:
    build: .
    container_name: enginemind-ui
    command: streamlit run app/streamlit_app.py --server.port 8501 --server.address 0.0.0.0
    ports:
      - "8501:8501"
    depends_on:
      - api
    environment:
      - FASTAPI_URL=http://api:8000
    volumes:
      - ./data:/app/data
      - ./models/saved:/app/models/saved
      - ./docs:/app/docs
    restart: unless-stopped
